<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test botón</title>
<style>
body{font-family:system-ui,sans-serif;padding:24px;background:#f4f6f9}
button{display:block;width:100%;padding:16px;margin:12px 0;font-size:16px;border-radius:12px;border:1px solid #ccc;background:#0E7C86;color:#fff;font-weight:600}
#salida{margin-top:20px;padding:16px;background:#fff;border-radius:10px;min-height:60px;font-family:monospace;font-size:14px;white-space:pre-wrap;border:2px solid #0E7C86}
</style>
</head>
<body>
<h2>Prueba de botones</h2>
<p>Tocá cada botón. Abajo tiene que aparecer un mensaje.</p>

<button onclick="document.getElementById('salida').textContent='✅ BOTÓN 1 (onclick directo) funciona · ' + new Date().toLocaleTimeString()">Botón 1 — onclick directo</button>

<button id="btn2">Botón 2 — addEventListener</button>

<button onclick="probar()">Botón 3 — llama función</button>

<div id="salida">Todavía no tocaste nada.</div>

<script>
function probar(){
  document.getElementById('salida').textContent='✅ BOTÓN 3 (función) funciona · ' + new Date().toLocaleTimeString();
}
document.getElementById('btn2').addEventListener('click', function(){
  document.getElementById('salida').textContent='✅ BOTÓN 2 (listener) funciona · ' + new Date().toLocaleTimeString();
});
document.getElementById('salida').textContent='✅ El JavaScript cargó bien. Ahora tocá los botones.';
</script>
</body>
</html>
